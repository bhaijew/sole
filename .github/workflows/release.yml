name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install --ignore-scripts

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend (Next.js)
        run: npm run build:frontend

      - name: Build Backend (TypeScript)
        run: npm run build

      - name: Publish Windows Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx cross-env ELECTRON_BUILDER_COMPRESSION_LEVEL=1 electron-builder --win --publish always -c.publish.releaseType=release
